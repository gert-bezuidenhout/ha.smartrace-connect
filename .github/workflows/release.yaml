name: Release
on:
  push:
    branches: [main]
    paths:
      - custom_components/smartrace_connect/manifest.json
      - .github/workflows/release.yaml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check Python syntax
        run: python -m compileall -q custom_components
      - name: Install test dependencies
        run: python -m pip install aiohttp voluptuous voluptuous-serialize
      - name: Run regression tests
        run: |
          python test_config_schema.py
          python test_reconfigure.py
          python test_transport.py
      - name: Home Assistant validation
        uses: home-assistant/actions/hassfest@master
  publish:
    needs: [validate, hacs]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish numbered release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(jq -r '.version' custom_components/smartrace_connect/manifest.json)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test -f "docs/releases/$VERSION.md"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; leaving it unchanged."
            exit 0
          fi
          gh release create "$VERSION" --target "$GITHUB_SHA" --title "SmartRace Connect $VERSION" --notes-file "docs/releases/$VERSION.md" --latest
