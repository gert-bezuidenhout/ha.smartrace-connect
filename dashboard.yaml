type: vertical-stack
cards:
  - type: entities
    title: SmartRace Connect
    show_header_toggle: false
    entities:
      - entity: binary_sensor.smartrace_connect_connection
        name: Connection
      - entity: sensor.smartrace_connect_server_address
        name: Server address
  - type: grid
    title: Race control
    columns: 4
    square: false
    cards:
      - type: button
        entity: button.smartrace_connect_start
        name: Start
        icon: mdi:play
        icon_height: 36px
        show_state: false
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.smartrace_connect_start
        hold_action:
          action: more-info
      - type: button
        entity: button.smartrace_connect_stop
        name: Stop
        icon: mdi:stop
        icon_height: 36px
        show_state: false
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.smartrace_connect_stop
        hold_action:
          action: more-info
      - type: button
        entity: button.smartrace_connect_esc
        name: ESC
        icon: mdi:car-emergency
        icon_height: 36px
        show_state: false
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.smartrace_connect_esc
        hold_action:
          action: more-info
      - type: button
        entity: button.smartrace_connect_vsc
        name: VSC
        icon: mdi:car-speed-limiter
        icon_height: 36px
        show_state: false
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.smartrace_connect_vsc
        hold_action:
          action: more-info
  - type: entities
    show_header_toggle: false
    entities:
      - entity: button.smartrace_connect_reload_weather_settings
        name: Reload weather settings
        action_name: Reload
  - square: false
    type: grid
    title: Time penalties (+5 seconds)
    columns: 3
    cards:
      - show_name: true
        show_icon: true
        type: button
        entity: button.smartrace_connect_controller_1_penalty_5_seconds
        name: Controller 1 +5 s
        icon: mdi:timer-plus
        icon_height: 30px
        show_state: false
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.smartrace_connect_controller_1_penalty_5_seconds
        hold_action:
          action: more-info
      - show_name: true
        show_icon: true
        type: button
        entity: button.smartrace_connect_controller_2_penalty_5_seconds
        name: Controller 2 +5 s
        icon: mdi:timer-plus
